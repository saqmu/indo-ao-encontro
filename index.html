<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indo ao Encontro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- O CONTÊINER QUE SEGURA TUDO -->
    <main id="mundo">
        
        <!-- PARTE 1: A JANELA (Onde ficarão os biomas) -->
        <section id="area-janela">
            <div class="parede">
                <div class="moldura">
                    <!-- O cenário vai passar aqui dentro -->
                    <div id="cenario" class="bioma-mata">
                        <div class="camada nuvens"></div>
                        <div class="camada montanhas"></div>
                        <div class="camada solo"></div>
                        <div class="objetos-passando" id="container-objetos">
                            <!-- Árvores/Prédios entrarão via JavaScript depois -->
                        </div>
                    </div>
                </div>
                
                <!-- BOTOES DE INTERAÇÃO -->
                <div class="controles-janela">
                    <button onclick="mudarBioma()" class="btn-viagem">Próxima Região</button>
                    <button onclick="mudarClima()" class="btn-clima">Trocar Clima</button>
                    <button onclick="alternarDiaNoite()" class="btn-luz">🌙 / ☀️</button>
                </div>
            </div>
        </section>

        <!-- PARTE 2: A MESA (Onde você escreve) -->
        <section id="area-mesa">
            <div id="cena-3d">
                
                <!-- O LIVRO ABERTO -->
                <div id="livro-3d" class="tremor">
                    <div class="folha esquerda"></div>
                    <div class="folha direita">
                        <h2 class="titulo">Anotações</h2>
                        <textarea id="bloco-notas" placeholder="Escreva sua jornada..."></textarea>
                        <div class="linha-pauta"></div>
                    </div>
                </div>

                <!-- A XÍCARA DE CAFÉ -->
                <div id="xicara-3d" class="tremor">
                    <div class="fumaça">
                        <span></span><span></span><span></span>
                    </div>
                    <div class="liquido"></div>
                    <div class="asa"></div>
                </div>

            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
